<!doctype html><html><head><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><style>body{margin:0}</style></head><body><script type="module">
import * as THREE from 'three'; import * as M from './models.js'; import {buildSwamp,buildDowntown} from './regions.js';

const s=new THREE.Scene();s.background=M.skyColor(0.5);s.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));const sun=new THREE.DirectionalLight(0xffe0c0,2);sun.position.set(60,120,30);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-300,right:300,top:300,bottom:-300,far:700});sun.shadow.mapSize.set(2048,2048);s.add(sun);s.add(sun.target);

</script></body></html>
