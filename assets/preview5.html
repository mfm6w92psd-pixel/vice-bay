<!doctype html><html><head><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><style>body{margin:0}</style></head><body><script type="module">
import * as THREE from 'three'; import * as M from './models.js'; import {buildInterstate} from './interstates.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=M.skyColor(0.5);s.fog=new THREE.Fog(0x87ceeb,200,700);s.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));const sun=new THREE.DirectionalLight(0xffe0c0,2);sun.position.set(40,60,20);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150});sun.shadow.mapSize.set(2048,2048);s.add(sun);
const g=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),M.mat(0x8fc77a));g.rotation.x=-Math.PI/2;g.receiveShadow=true;s.add(g);

const L=hw.lanes;[[0,60],[0,150],[2,100],[3,200],[1,300]].forEach(([li,d])=>{const p=L[li].points,a=p[0],b=p[1],dir=b.clone().sub(a).normalize();const c=M.makeCar();c.position.copy(a).addScaledVector(dir,d);c.rotation.y=Math.atan2(-dir.x,-dir.z);s.add(c);});
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);cam.position.set(-30,22,-10);cam.lookAt(10,0,140);let f=0;(function loop(){r.render(s,cam);if(++f<30)requestAnimationFrame(loop);})();
</script></body></html>
